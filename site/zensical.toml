[project]
site_url = "https://slot-cfw.fyi/"
site_name = "slot."
site_description = "A bespoke, Game Boy-centric frontend for the Anbernic RG SP."
repo_url = "https://github.com/BrandonKowalski/slot"
repo_name = "BrandonKowalski/slot"
docs_dir = "docs"
site_dir = "public"

nav = [
  { "Home" = "index.md" },
  { "Installing" = "installing.md" },
  { "Updating" = "updating.md" },
  { "Tour" = "tour.md" },
  { "Guide" = [
    "guide/index.md",
    "guide/shelf.md",
    "guide/playing.md",
    "guide/save-states.md",
    "guide/speed.md",
    "guide/screen.md",
    "guide/controls.md",
    "guide/linking.md",
    "guide/power.md",
    "guide/customizing.md",
    "guide/settings.md",
    "guide/storage.md",
    "guide/troubleshooting.md",
  ] },
  { "Questions" = "questions.md" },
  { "Credits" = "credits.md" },
  { "Studio" = "https://studio.slot-cfw.fyi" },
]

extra_css = ["assets/slot.css"]
extra_javascript = ["assets/slot.js"]

[project.theme]
custom_dir = "overrides"
favicon = "favicon.svg"
language = "en"
features = [
  "content.tabs.link",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Open Sans"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
