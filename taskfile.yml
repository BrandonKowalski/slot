version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  GPSP_HOST: vendor/gpsp_libretro.dylib
  # mGBA is built rather than fetched: libretro/mgba at this commit, which is what the buildbot
  # was serving when issue #1 was found, with cores/mgba's patches on top. The buildbot builds
  # the same fork, and that fork lacks upstream's fix for the Classic NES Series audio
  # (mgba-emu/mgba 685023e05). Once libretro/mgba carries it, drop the patch and fetch again.
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p slot

  test:
    desc: Run the whole test suite
    cmds:
      - cargo test --workspace

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    cmds:
      - cargo test --workspace {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      # No --all-targets: the tests exercise the host backends and the device build has none.
      - cargo clippy -p slot --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test

  core:
    desc: >-
      Build mGBA and fetch gpSP for this host. gpSP is selectable per game, so a host that
      only has mGBA silently runs the mock instead - a rainbow test pattern and a sine tone,
      which reads as "gpSP is broken" rather than "gpSP is missing"
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    # Built, not fetched: see MGBA_COMMIT above. The .meta beside the core is what `status`
    # compares, so a changed pin or patch rebuilds, and a buildbot core left in vendor/ from
    # before (it has no .meta) is replaced rather than trusted.
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    # No source archive alongside it, unlike core:gpsp. That task ships its binary to a
    # device, which is what makes GPL-2.0 section 3(a) apply; this one lands in vendor/,
    # which is gitignored and never leaves the machine that fetched it.
    status:
      - test -f {{.GPSP_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gpsp-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gpsp_libretro.dylib.zip"
        unzip -o -q vendor/gpsp-host.zip -d vendor
        rm -f vendor/gpsp-host.zip
        file {{.GPSP_HOST}} | grep -q Mach-O
        echo "fetched {{.GPSP_HOST}}"

  core:update:
    desc: Rebuild mGBA and re-fetch gpSP for this host even if they are already vendored
    cmds:
      - rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/slot-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games, labels in Labels, gba_bios.bin in BIOS, pngs in Wallpapers, palette in System/theme.txt"'

  run:
    desc: >-
      Run slot. against SLOT_ROOT, defaults to ./sdcard. SLOT_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      # Release, always. Measured on this machine, a debug build spends 8.43 ms of a
      # 16.67 ms frame inside one rewind snapshot; release spends 0.08 ms. Debug does not
      # hold 60 fps, so running it only produces bug reports about stutter.
      - cargo run --release -p slot

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_BARE: '1'
    cmds:
      # Nothing on screen but the panel, so a capture needs no cropping. The window cannot
      # be dragged or closed with the mouse while it is undecorated: quit with Cmd+Q.
      - cargo run --release -p slot

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p slot

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [core, release]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/slot --init-root {{.OUT}}
      - cp target/release/slot {{.OUT}}/System/slot
      - cp {{.CORE}} {{.GPSP_HOST}} {{.OUT}}/System/
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    # Same script, pin, patches and .meta check as core:mgba:host, run where `build:device`
    # runs, so the core links against the same glibc 2.31 as slot. Its own work directory,
    # since a cmake build tree cannot be shared between two toolchains.
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:gpsp:
    desc: >-
      Fetch the aarch64 linux gpSP core together with its GPL-2.0 section 3(a) corresponding
      source, as one set
    # Binary, source archive, sha and metadata are fetched, resolved and verified by one
    # script, and the status check below requires all four. That is what stops the binary and
    # the source silently drifting apart: with independent guards (as this used to have),
    # deleting only the .so to pick up a newer nightly would refetch just the binary and
    # leave it paired with a source recorded on some earlier run. Here, any one of the four
    # missing means none of them are trusted, and the whole set is refetched together.
    status:
      - test -f vendor/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test -f vendor/gpsp-src.sha
      - test -f vendor/gpsp-src.meta
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        # Clear the whole set first. A partial leftover (say, a .meta from a run that got
        # killed before it finished) must never be reused as if it belonged to what's fetched
        # below.
        rm -f vendor/gpsp_libretro.so vendor/gpsp-linux.zip \
              vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta

        curl -fsSL -o vendor/gpsp-linux.zip \
          "https://buildbot.libretro.com/nightly/linux/aarch64/latest/gpsp_libretro.so.zip"

        # Anchor the source to the binary's own build timestamp, not to whenever we happen to
        # run this task. The zip's HTTP Last-Modified header is not a safe stand-in for that:
        # it moves whenever the buildbot's storage re-touches the file even though the binary
        # inside hasn't changed — confirmed directly while writing this, a fresh HEAD on this
        # same URL returned a Last-Modified two days newer than a .so whose sha256 was
        # byte-for-byte identical to what was already vendored. The zip entry's own timestamp,
        # set once when the file was archived, doesn't move like that: it's the closer
        # stand-in for when gpSP was actually compiled, so that's what gets anchored to.
        # `unzip -Z -T` reads it straight out of the zip's central directory as sortable
        # digits (YYYYMMDD.HHMMSS) — a verbatim field read, not a localtime round trip, so it
        # comes out identical on every machine regardless of that machine's own timezone. The
        # digits carry no timezone of their own; they're treated as UTC here, matching the
        # buildbot's own Last-Modified (which is GMT) and standard practice for CI build
        # infrastructure generally.
        raw="$(unzip -Z -T vendor/gpsp-linux.zip gpsp_libretro.so | grep -E '^-' | awk '{print $(NF-1)}')"
        binary_date="$(printf '%s' "$raw" | \
          sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})\.([0-9]{2})([0-9]{2})([0-9]{2})$/\1-\2-\3T\4:\5:\6Z/')"
        if [ -z "$binary_date" ]; then
          echo "could not read gpsp_libretro.so's timestamp out of the fetched zip" >&2
          exit 1
        fi

        unzip -o -q vendor/gpsp-linux.zip -d vendor
        rm -f vendor/gpsp-linux.zip
        file vendor/gpsp_libretro.so | grep -q aarch64

        # Resolve libretro/gpsp's master as of the binary's own timestamp above, not as of
        # now: source visibly newer than the binary it's meant to correspond to is exactly the
        # failure mode this replaces. GitHub's commits API can name master's tip as of a given
        # moment via `until=`; `git ls-remote` can only ever name master's tip *right now*, so
        # it is a fallback for when the API can't be reached — unauthenticated, it's
        # rate-limited to 60/hr — not the first choice, and which one actually ran is recorded
        # below, so the shipped archive never claims a precision it didn't get.
        sha=""
        method=""
        api_response="$(curl -fsS --max-time 10 \
          "https://api.github.com/repos/libretro/gpsp/commits?until=${binary_date}&per_page=1" \
          2>/dev/null || true)"
        if [ -n "$api_response" ]; then
          sha="$(printf '%s' "$api_response" | grep -m1 '"sha"' | sed -E 's/.*"sha": *"([0-9a-f]+)".*/\1/')"
        fi
        if [ -n "$sha" ]; then
          method="github-api"
        else
          echo "GitHub API unreachable or exhausted; falling back to git ls-remote master (current tip, NOT anchored to ${binary_date})" >&2
          sha="$(git ls-remote https://github.com/libretro/gpsp master | cut -f1)"
          method="git-ls-remote-fallback"
        fi
        if [ -z "$sha" ]; then
          echo "could not resolve libretro/gpsp's master commit by any method" >&2
          exit 1
        fi

        curl -fsSL -o vendor/gpsp-src.tar.gz \
          "https://github.com/libretro/gpsp/archive/${sha}.tar.gz"
        # A real gpSP checkout, not just a valid tarball: same shape as any GitHub source
        # archive, one top directory named for the commit, and the Makefile lives in it.
        tar -tzf vendor/gpsp-src.tar.gz | grep -q "^gpsp-${sha}/Makefile$"

        echo "$sha" > vendor/gpsp-src.sha
        {
          echo "commit=${sha}"
          echo "binary_date=${binary_date}"
          echo "resolved_via=${method}"
        } > vendor/gpsp-src.meta

        echo "fetched vendor/gpsp_libretro.so and vendor/gpsp-src.tar.gz @ ${sha} (anchored ${binary_date}, ${method})"

  core:gpsp:update:
    desc: Re-fetch gpSP's core and source together, even if some of the set is already vendored
    cmds:
      - rm -f vendor/gpsp_libretro.so vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp

  device:sh:
    desc: Run CMD on the box the device build wants, fetching one if this is not it
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - |
        set -eu
        # Already standing on the target means the container would only be in the way, and in
        # CI there is no docker to reach for anyway: the job is already running in this image.
        #
        # Bullseye is glibc 2.31 on purpose: older is forward compatible, and BaseOS is 2.35.
        # Building against 2.35 and running on anything older would not be. Off target,
        # OrbStack runs arm64 natively, so that is still a native build in a container rather
        # than a cross compile.
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}'
        fi

  build:device:
    desc: Build for the H700, in an arm64 container unless this is already one
    cmds:
      # Relative paths only: they have to mean the same thing from the repo root and from /src.
      - task: device:sh
        vars:
          CMD: >-
            cargo build --release --target-dir target-device
            -p slot --no-default-features --features device
      - file target-device/release/slot | grep -q aarch64
      - 'echo "built target-device/release/slot"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    # Both cores now ship: crates/slot/src/core.rs resolves the dylib from a cart's own
    # Core, so a card naming gpsp in System/selected_core.ini gets gpSP for real rather than
    # mGBA wearing its name.
    deps: [core:device, core:gpsp, build:device]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
    cmds:
      - rm -rf {{.OUT}}
      # Scaffolded by the device binary rather than a host build: `--init-root` returns before
      # anything hardware shaped is opened, so the aarch64 binary can make its own folders.
      # That leaves the tree needing no host toolchain at all — no X11, no ALSA, no udev —
      # which is what lets a CI runner build this without a desktop's worth of headers.
      - task: device:sh
        vars:
          CMD: ./target-device/release/slot --init-root {{.OUT}}
      - cp target-device/release/slot {{.OUT}}/System/slot
      # `core:device` and `core:gpsp`'s own arch check only runs on a fresh fetch: their
      # `status` skips the whole task, check included, whenever a file of that name already
      # exists — so a hand-placed x86 `.so` sails through unchecked from here on. Re-checked
      # now, right before it ships, for both cores.
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - cp vendor/mgba_libretro.so {{.OUT}}/System/
      - cp vendor/gpsp_libretro.so {{.OUT}}/System/
      - cp -r licenses {{.OUT}}/System/licenses
      # GPL-2.0 section 3(a): gpSP's corresponding source travels with the binary. It lands
      # inside licenses/ itself, next to the license text that explains it, named for the
      # commit core:gpsp resolved so the file identifies its own source with no release page
      # to point back to — the exact thing a hand-built SD card does not have. The .meta file
      # travels with it, named to match, so the anchor timestamp and resolution method
      # core:gpsp recorded ship on the card too, not only in a GitHub release's notes.
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
      # MPL-2.0: mGBA ships patched, so what changed travels with it. Every patch
      # cores/mgba/build.sh applied lands here, prefixed `mgba-`, beside the .meta naming the
      # libretro/mgba commit they apply to, whose source is public there. The .meta is named for
      # that commit, as gpSP's files are.
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    # See the note on dist:device: both cores are real now, so both are pushed.
    deps: [core:device, core:gpsp, build:device]
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      # Same re-check as `dist:device`, and for the same reason: this pushes straight from
      # `vendor/`, which a hand-placed x86 `.so` can sit in unchecked once the fetch tasks'
      # own `status` has started skipping them.
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      # Onto the card the device is already running from, rather than a tree to copy by hand.
      # The binary is replaced under the running process, which is why the reboot below is
      # part of the task and not left to be remembered.
      - adb push target-device/release/slot '{{.SD}}/System/slot'
      - adb push vendor/mgba_libretro.so '{{.SD}}/System/mgba_libretro.so'
      - adb push vendor/gpsp_libretro.so '{{.SD}}/System/gpsp_libretro.so'
      # Into System/, not onto System/licenses: adb copies a folder inside a destination that
      # already exists, so naming licenses itself nested a fresh copy inside the old one on
      # every deploy after the first and left the notice at the top of the card stale.
      - adb push licenses '{{.SD}}/System/'
      # Same reasoning as dist:device: the source belongs on the card next to the binary it
      # corresponds to, not only offered on request, and the .meta beside it so the anchor
      # timestamp and resolution method travel too.
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        adb push vendor/gpsp-src.tar.gz "{{.SD}}/System/licenses/gpsp-${sha}.tar.gz"
        adb push vendor/gpsp-src.meta "{{.SD}}/System/licenses/gpsp-${sha}.meta"
      # Same as dist:device: mGBA's patches, and the .meta naming the commit they apply to.
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        adb push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - adb shell 'chmod +x {{.SD}}/System/slot && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      # The device has no console: launch.sh redirects here, and this is the only account of
      # what hardware slot found. `SLOT_TRACE=1` in launch.sh adds the frame and audio lines.
      - adb shell 'cat {{.SD}}/slot.log'

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist dist-device target-device
