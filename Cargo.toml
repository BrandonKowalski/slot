[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
png = "0.17"
fontdue = "0.9"
libloading = "0.8"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"
cpal = "0.15"
gilrs = "0.11"
tempfile = "3"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }

# The SP's builds use this profile: build:device and bench:device, and so whatever dist:device
# and deploy:device ship. It is release plus fat LTO in one codegen unit, which measured on the
# SP with core_bench takes up to 2.2% off a frame where slot's own work is the biggest share.
# The Mac's release builds stay plain: LTO turned a 3 s rebuild after one edit into 22 s there,
# for a speed-up only the SP needs. -C target-cpu=cortex-a53 was measured too and is left out:
# no faster alone, and it cancelled LTO's gain when combined.
[profile.device]
inherits = "release"
lto = "fat"
codegen-units = 1
