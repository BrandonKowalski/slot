name: release

# A tag cuts the release. Running it by hand builds the same tree and leaves it as an
# artifact instead, so the pipeline can be exercised without spending a version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    # Native arm64, so the image below is the build box rather than an emulator. Free on
    # public repositories, which this is.
    runs-on: ubuntu-24.04-arm
    # The same image the taskfile reaches for off target, so a released binary is linked
    # against the same glibc 2.31 as one built at a desk. Being inside it already is what
    # makes `task dist:device` skip its docker call.
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      mgba_sha: ${{ steps.package.outputs.mgba_sha }}
      gpsp_sha: ${{ steps.package.outputs.gpsp_sha }}
      core_date: ${{ steps.package.outputs.core_date }}
      gpsp_head: ${{ steps.package.outputs.gpsp_head }}
    steps:
      - uses: actions/checkout@v7

      # The image already carries curl, file and unzip, which the fetch and the arch check
      # need. zip is the only thing missing.
      - name: Install zip and Task
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends zip
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      # Named for the tag, so what comes out of the archive says which version it is rather
      # than landing seven unlabelled folders wherever it was opened.
      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}"

      # Before anything is published, not after. A tree built by the wrong toolchain is a
      # download that bootloops a device, and it costs one exec to know.
      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          # GPL-2.0 section 3(a): the release does not ship without gpSP's corresponding
          # source. `task dist:device` names the file for the commit `core:gpsp:source`
          # recorded, so that recording is what says which file to look for.
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          {
            echo "zip=$zip"
            # Recorded rather than pinned: both cores are whatever the buildbot was serving
            # as latest when this ran, and a release should be able to say which ones those
            # were. Both are hashed, not only mGBA's — the release ships gpSP's binary too,
            # and a card with a corrupted or substituted gpSP core deserves the same way to
            # check it against the announcement as mGBA already had.
            echo "mgba_sha=$(sha256sum vendor/mgba_libretro.so | cut -d' ' -f1)"
            echo "gpsp_sha=$(sha256sum vendor/gpsp_libretro.so | cut -d' ' -f1)"
            echo "core_date=$(date -u +%Y-%m-%d)"
            # The commit whose source archive actually shipped in this zip (see
            # licenses/README.md) — read back from what core:gpsp:source recorded, not
            # re-resolved here, so this can never name a different commit than the file
            # the "Check what is about to ship" step just verified is in the tree.
            echo "gpsp_head=$(cat vendor/gpsp-src.sha)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    # Skipped on a manual run, which leaves the artifact above and nothing else.
    if: startsWith(github.ref, 'refs/tags/')
    # Not the arm runner and not a container: this job only moves a file, and gh is already
    # on the stock image.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          MGBA_SHA: ${{ needs.build.outputs.mgba_sha }}
          GPSP_SHA: ${{ needs.build.outputs.gpsp_sha }}
          CORE_DATE: ${{ needs.build.outputs.core_date }}
          GPSP_HEAD: ${{ needs.build.outputs.gpsp_head }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Unzip and copy the contents of \`slot-${GITHUB_REF_NAME}/\` onto SD2.

          | | |
          |---|---|
          | \`System/slot\` | aarch64, built against glibc 2.31 |
          | \`System/mgba_libretro.so\` | libretro buildbot nightly, fetched ${CORE_DATE}, sha256 \`${MGBA_SHA}\` |
          | \`System/gpsp_libretro.so\` | libretro buildbot nightly, fetched ${CORE_DATE}, sha256 \`${GPSP_SHA}\` |
          | \`System/licenses/gpsp-${GPSP_HEAD}.tar.gz\` | gpSP source, libretro/gpsp \`master\` @ \`${GPSP_HEAD}\` |

          mGBA is MPL-2.0, gpSP is GPL-2.0 — both shipped as unmodified libretro cores, both
          credited with their license text under \`System/licenses/\`. gpSP's corresponding
          source ships in this zip too, per GPL-2.0 section 3(a): the buildbot does not publish
          which commit a nightly was built from, so \`master\`'s HEAD at fetch time,
          \`${GPSP_HEAD}\`, is the closest identifiable source rather than a proven match to
          this exact binary. \`System/licenses/README.md\` says so plainly and keeps a
          section 3(b) written offer as a backstop for the gap.
          NOTES
          # --repo because this job never checks out: gh works out where to publish from the
          # git remote otherwise, and there is no repository here to ask.
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md