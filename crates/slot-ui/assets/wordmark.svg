  <!-- ANBERNIC RG SP, set as outlines so no font ships with the frontend. The maker's name is
       Futura Bold sheared into an italic, because Apple's Futura has no Bold Italic cut; the
       model is the GameCube face, which is what the article's ADVANCE is set in. The name is
       set 1.35x the model, on one baseline, as the article sets its own two.

       The white keyline is the signature, and it is drawn by z-order: every glyph is stroked
       first and then filled with the label's ground on top, so stroke that landed inside a
       neighbouring letter is covered and what survives is the outline of the silhouette. A
       per-glyph stroke would rule a line between every pair of letters instead. -->
