<svg xmlns="http://www.w3.org/2000/svg" viewBox="24.813 11.25 48.375 77.4" width="48.375" height="77.4">
  <!-- The Game Boy Color shelf's mark: a Game Boy Color, the actual one. Its screen is filled
       rather than outlined, which is the artist's drawing and not a rendering fault — it makes
       the Colour the one with a lit screen, which is not the worst way for it to differ.

       "Game Boy Color" by Ryan Beck, from the Noun Project under CC BY:
       https://thenounproject.com/icon/game-boy-color-44993/

       The free download baked its credit into the drawing as two lines of type below it. A
       32 px mark in the corner of the status plate cannot carry a sentence, so the type is
       stripped and the attribution is carried in licenses/README.md instead, which is what
       CC BY asks and is not optional: stripping the credit without attributing elsewhere
       would breach it.

       Stripping it also moved the drawing's bounds, so the viewBox is re-fitted. It was
       0 0 100 125, sized to hold the credit; the drawing alone spans x 25.875..72.125 by
       y 11.25..88.65, and that box is widened about its own centre to the 5:8 width-to-height
       the three marks share. The paths are the artist's, untouched. -->
