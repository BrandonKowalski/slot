<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.75 0 62.5 100" width="62.5" height="100">
  <!-- The Game Boy shelf's mark: the original Game Boy, the DMG — tall and boxy, with its two
       buttons on the angle.

       "Gameboy Color" by costantino montanari, from the Noun Project under CC BY:
       https://thenounproject.com/icon/gameboy-color-3633999/

       That title is wrong and so was the file it downloaded as, noun_GameboyColor_3633999.svg:
       the drawing is plainly a DMG, and the actual Colour is a different icon by a different
       artist. The three were mapped by rasterising them and looking, and each is named here for
       what it draws rather than for what it arrived called.

       The free download baked its credit into the drawing as two lines of type below it. A
       32 px mark in the corner of the status plate cannot carry a sentence, so the type is
       stripped and the attribution is carried in licenses/README.md instead, which is what
       CC BY asks and is not optional: stripping the credit without attributing elsewhere
       would breach it.

       Stripping it also moved the drawing's bounds, so the viewBox is re-fitted. It was
       0 0 100 125, sized to hold the credit; the drawing alone spans x 18.9..81.1 by y 0..100.
       This is the widest of the three and so is what set the 5:8 width-to-height they all
       share; the 0.15 of a unit it gains at each side is the rounding to it. The paths are the
       artist's, untouched. -->
