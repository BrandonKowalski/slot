<!--
  The moulding on a class C Game Pak's face — the clear shell a CGB flag of 0xc0 shipped in.
  Derived from gb_cart_detail.svg the way gbc_cart.svg is derived from gb_cart.svg, so the pair
  cannot drift apart stylistically and the differences are only the ones the shells have. There
  are two: the shoulder, and the rolled top edge.

  The first is the shoulder. A class A/B pak wears five moulded ribs a side running most
  of the way across its shoulder and up to the lettering plate; a class C pak's shoulder is
  completely smooth, and its ribbing survives only as short ridges on the outer *side* edges,
  sitting just below the rounded top corners. The user named this looking at the rendered
  shelf — "gbc carts don't have lines on the header" — and a square-on photograph of the shell
  bears it out: the header panel carrying the moulded GAME BOY COLOR lettering has nothing
  across it at all. The ridges keep the rows the class A/B ribs are on, so the two shells are
  plainly the same object with one feature cut back rather than two drawings of it.

  The photograph is a commercial parts listing for a replacement shell with no licence stated.
  Nothing here is traced from it: what it settled is a fact about the hardware — which surfaces
  carry ribbing — and the geometry below is gb_cart_detail.svg's own, cut back. The user's line
  drawing stays the only art asset that ships.

  The second is the rolled top edge below. It is drawn only here, and not because a class A/B pak
  has no rounded edge of its own but because that shell's drawing is the user's own line art and
  is settled: its shoulder gets its character from the ribs and the notch, and nothing in this
  file reaches it.

  Everything else is gb_cart_detail.svg unchanged: the lettering plate, the grooves down both
  sides, the arrow, and the black-is-shadow white-is-light convention that
  `silhouette::rasterise_detail` splits the file on. See that file for the reasoning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 253">
  <defs>
    <!-- Standing proud of the shell: the lettering plate, and the five short edge ridges a side
         that are all a class C shoulder carries. They reach 7 px in from the body edge against
         the class A/B rib's 29, which is the proportion the shell photographs at. -->
    <g id="ridges">
      <path fill-rule="evenodd" d="M 6.5 20.7 L 13.5 20.7 L 13.5 26.65 L 6.5 26.65 Z M 8.75 22.89 L 11.25 22.89 L 11.25 24.46 L 8.75 24.46 Z"/>
      <path fill-rule="evenodd" d="M 233.5 20.7 L 226.5 20.7 L 226.5 26.65 L 233.5 26.65 Z M 231.25 22.89 L 228.75 22.89 L 228.75 24.46 L 231.25 24.46 Z"/>
      <path fill-rule="evenodd" d="M 6.5 28.48 L 13.5 28.48 L 13.5 34.43 L 6.5 34.43 Z M 8.75 30.67 L 11.25 30.67 L 11.25 32.24 L 8.75 32.24 Z"/>
      <path fill-rule="evenodd" d="M 233.5 28.48 L 226.5 28.48 L 226.5 34.43 L 233.5 34.43 Z M 231.25 30.67 L 228.75 30.67 L 228.75 32.24 L 231.25 32.24 Z"/>
      <path fill-rule="evenodd" d="M 6.5 36.25 L 13.5 36.25 L 13.5 42.2 L 6.5 42.2 Z M 8.75 38.44 L 11.25 38.44 L 11.25 40.01 L 8.75 40.01 Z"/>
      <path fill-rule="evenodd" d="M 233.5 36.25 L 226.5 36.25 L 226.5 42.2 L 233.5 42.2 Z M 231.25 38.44 L 228.75 38.44 L 228.75 40.01 L 231.25 40.01 Z"/>
      <path fill-rule="evenodd" d="M 6.5 44.03 L 13.5 44.03 L 13.5 49.98 L 6.5 49.98 Z M 8.75 46.22 L 11.25 46.22 L 11.25 47.79 L 8.75 47.79 Z"/>
      <path fill-rule="evenodd" d="M 233.5 44.03 L 226.5 44.03 L 226.5 49.98 L 233.5 49.98 Z M 231.25 46.22 L 228.75 46.22 L 228.75 47.79 L 231.25 47.79 Z"/>
      <path fill-rule="evenodd" d="M 6.5 51.8 L 13.5 51.8 L 13.5 57.75 L 6.5 57.75 Z M 8.75 53.99 L 11.25 53.99 L 11.25 55.56 L 8.75 55.56 Z"/>
      <path fill-rule="evenodd" d="M 233.5 51.8 L 226.5 51.8 L 226.5 57.75 L 233.5 57.75 Z M 231.25 53.99 L 228.75 53.99 L 228.75 55.56 L 231.25 55.56 Z"/>
      <path fill-rule="evenodd" d="M 57.2 16 L 182.8 16 A 24 24 0 0 1 182.8 64 L 57.2 64 A 24 24 0 0 1 57.2 16 Z M 57.2 18.2 L 182.8 18.2 A 21.8 21.8 0 0 1 182.8 61.8 L 57.2 61.8 A 21.8 21.8 0 0 1 57.2 18.2 Z"/>
    </g>
    <!-- Cut into the shell: the grooves down both sides, and the arrow that says which way up
         the pak goes in. Both moulds carry these. -->
    <g id="cuts">
      <rect x="12.82" y="105.3" width="2.25" height="146.5" rx="1.12"/>
      <rect x="224.93" y="105.3" width="2.25" height="146.5" rx="1.12"/>
      <path fill-rule="evenodd" d="M 101.54 224.29 L 138.46 224.29 L 120 245.76 Z M 104.59 226.49 L 135.41 226.49 L 120 243.04 Z"/>
    </g>
  </defs>
  <!--
    The rolled top edge. A class C pak's top is not a flat plate with rounded corners: it is a
    domed surface that turns over from the front face to the top edge, and that roll carries a
    lit band along its whole length, corners included. Both photographs in
    `slot-card-backups/cart-refs` show it — the square-on parts listing, and Evan Amos's
    public-domain three-quarter view of a real cartridge, where the band and the line where it
    breaks onto the header are unmistakable. Without it the top reads as a cut-out rather than as
    moulded plastic, which is what the user meant by asking for a more bulbous top: class A/B's
    shoulder gets its character from the ribs and the notch, and class C's comes almost entirely
    from this.

    Drawn as four nested strokes of the top contour offset 7 px inward — the same corner with
    11 px of radius left after the offset, so the band turns the corner with the outline instead
    of running straight across it. Widths 10, 7, 4.5 and 2.2 about that line, stacking to
    coverages of about 0.30, 0.50, 0.64 and 0.73: a ramp that starts 2 px in, crests at 7, and is
    gone by 12. Four steps rather than one gradient because a linear gradient can only run in one
    direction and at the corners this band runs diagonally — the ramp has to be measured from the
    contour, not from the top of the box.

    Starting 2 px in rather than at the very edge is the one thing that had to be got right.
    `cart::shell_face` already lightens the outermost 7 px of a translucent shell toward its rim
    colour, and that rim is *brighter* than anything the highlight channel can reach —
    `mould_detail` lifts a shell 24% toward white and no further. A band that covers the edge
    therefore drags the edge down and flattens the whole thing, which is what the first attempt
    did: 169 at the edge became 158. Held off it, the two stack instead of fighting, and the top
    edge goes from the rim's 7 px ramp straight to base to a 12 px band that holds near its
    crest most of the way down.

    Round caps, all four ending where the corner arc does. Nested, the caps fall off radially, so
    the band closes with a soft end rather than a cut across the side edge — and it hands over
    there to the rim gradient, which is already lighting the sides.
  -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path stroke-width="10" stroke-opacity="0.30" d="M 13.5 18 A 11 11 0 0 1 24.5 7 L 215.5 7 A 11 11 0 0 1 226.5 18"/>
    <path stroke-width="7" stroke-opacity="0.28" d="M 13.5 18 A 11 11 0 0 1 24.5 7 L 215.5 7 A 11 11 0 0 1 226.5 18"/>
    <path stroke-width="4.5" stroke-opacity="0.28" d="M 13.5 18 A 11 11 0 0 1 24.5 7 L 215.5 7 A 11 11 0 0 1 226.5 18"/>
    <path stroke-width="2.2" stroke-opacity="0.25" d="M 13.5 18 A 11 11 0 0 1 24.5 7 L 215.5 7 A 11 11 0 0 1 226.5 18"/>
  </g>
  <!--
    Where the roll breaks onto the flat of the shoulder. A lit band that merely fades out reads
    as a glow on a flat plate; what makes it read as volume is the surface turning past the light
    and going darker for a moment before it settles. The same contour offset 11.8 px inward, just
    past where the lit band runs out, so the break turns the corner with the roll above it. It
    stops where the corner arc does, clear of the side ridges below, which are a different
    feature and must not be drawn into.

    It is the strongest mark in the roll on purpose. The highlight can only lift the shell 31
    levels and the rim already occupies most of that range, so the shadow channel — which
    multiplies, and so has a 47 level swing on this plastic — is where the contrast that makes
    the edge read as swollen actually comes from.
  -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path stroke-width="2.6" stroke-opacity="0.55" d="M 18.3 18 A 6.2 6.2 0 0 1 24.5 11.8 L 215.5 11.8 A 6.2 6.2 0 0 1 221.7 18"/>
  </g>
  <g fill="#fff">
    <use href="#ridges" x="-1.1" y="-1.1"/>
    <use href="#cuts" x="1.1" y="1.1"/>
  </g>
  <g fill="#000">
    <use href="#ridges"/>
    <use href="#cuts"/>
  </g>
</svg>
