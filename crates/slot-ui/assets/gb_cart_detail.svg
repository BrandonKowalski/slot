<!--
  The moulding on a Game Pak's face, from the user's line drawing. One file serves both shells:
  class C differs from class A/B only in its top corners and its missing notch, and neither of
  those reaches any feature drawn here, so a shared detail is what keeps the two from drifting.

  The drawing is line art, so every feature arrives as the outline of a shape rather than the
  shape itself. That is kept: a moulded rib on plastic is read by its edges, and filling the
  bars solid would turn five ribs into one dark block. The label well's own outline is the one
  line deliberately not here — `cart::recess_label` already cuts that well.

  Black is shadow and white is light: `silhouette::rasterise_detail` splits this file into two
  masks by luminance, so one asset carries both the dark side of a moulded feature and the lit
  edge beside it. A single dark channel can only cut into the shell, which makes every feature
  read as a scratch. Light comes from the upper left, as it does for the label recess, so a
  ridge standing proud of the shell is lit on its upper left and a groove cut into it is lit on
  its lower right. Each lit edge is the same shape offset by half a line, drawn under the dark
  one so only the part that clears it shows.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 253">
  <defs>
    <!-- Standing proud of the shell: five ribs a shoulder, their inner ends cut back to follow
         the curve of the lettering plate, and the plate itself. Both grips run out to the body
         edge, where the silhouette trims them. -->
    <g id="ridges">
      <path fill-rule="evenodd" d="M 6.5 20.7 L 35.86 20.7 L 33.52 26.65 L 6.5 26.65 Z M 8.75 22.89 L 33.61 22.89 L 31.27 24.46 L 8.75 24.46 Z"/>
      <path fill-rule="evenodd" d="M 233.5 20.7 L 204.14 20.7 L 206.48 26.65 L 233.5 26.65 Z M 231.25 22.89 L 206.39 22.89 L 208.73 24.46 L 231.25 24.46 Z"/>
      <path fill-rule="evenodd" d="M 6.5 28.48 L 30.94 28.48 L 29.79 34.43 L 6.5 34.43 Z M 8.75 30.67 L 28.69 30.67 L 27.54 32.24 L 8.75 32.24 Z"/>
      <path fill-rule="evenodd" d="M 233.5 28.48 L 209.06 28.48 L 210.21 34.43 L 233.5 34.43 Z M 231.25 30.67 L 211.31 30.67 L 212.46 32.24 L 231.25 32.24 Z"/>
      <path fill-rule="evenodd" d="M 6.5 36.25 L 29.19 36.25 L 29.19 42.2 L 6.5 42.2 Z M 8.75 38.44 L 26.94 38.44 L 26.94 40.01 L 8.75 40.01 Z"/>
      <path fill-rule="evenodd" d="M 233.5 36.25 L 210.81 36.25 L 210.81 42.2 L 233.5 42.2 Z M 231.25 38.44 L 213.06 38.44 L 213.06 40.01 L 231.25 40.01 Z"/>
      <path fill-rule="evenodd" d="M 6.5 44.03 L 29.79 44.03 L 30.94 49.98 L 6.5 49.98 Z M 8.75 46.22 L 27.54 46.22 L 28.69 47.79 L 8.75 47.79 Z"/>
      <path fill-rule="evenodd" d="M 233.5 44.03 L 210.21 44.03 L 209.06 49.98 L 233.5 49.98 Z M 231.25 46.22 L 212.46 46.22 L 211.31 47.79 L 231.25 47.79 Z"/>
      <path fill-rule="evenodd" d="M 6.5 51.8 L 33.52 51.8 L 35.86 57.75 L 6.5 57.75 Z M 8.75 53.99 L 31.27 53.99 L 33.61 55.56 L 8.75 55.56 Z"/>
      <path fill-rule="evenodd" d="M 233.5 51.8 L 206.48 51.8 L 204.14 57.75 L 233.5 57.75 Z M 231.25 53.99 L 208.73 53.99 L 206.39 55.56 L 231.25 55.56 Z"/>
      <path fill-rule="evenodd" d="M 57.2 16 L 182.8 16 A 24 24 0 0 1 182.8 64 L 57.2 64 A 24 24 0 0 1 57.2 16 Z M 57.2 18.2 L 182.8 18.2 A 21.8 21.8 0 0 1 182.8 61.8 L 57.2 61.8 A 21.8 21.8 0 0 1 57.2 18.2 Z"/>
    </g>
    <!-- Cut into the shell: the grooves down both sides, and the arrow that says which way up
         the pak goes in. -->
    <g id="cuts">
      <rect x="12.82" y="105.3" width="2.25" height="146.5" rx="1.12"/>
      <rect x="224.93" y="105.3" width="2.25" height="146.5" rx="1.12"/>
      <path fill-rule="evenodd" d="M 101.54 224.29 L 138.46 224.29 L 120 245.76 Z M 104.59 226.49 L 135.41 226.49 L 120 243.04 Z"/>
    </g>
  </defs>
  <g fill="#fff">
    <use href="#ridges" x="-1.1" y="-1.1"/>
    <use href="#cuts" x="1.1" y="1.1"/>
  </g>
  <g fill="#000">
    <use href="#ridges"/>
    <use href="#cuts"/>
  </g>
</svg>
