    <rect x="0" y="0" width="240" height="135" fill="url(#wallShade)"/>
    <rect x="0" y="0" width="16" height="135" fill="#000" opacity=".2"/>
  </g>

  <!-- The board, its shadow on the floor, and the notch it leaves round the centre post. -->
  <rect x="17.5" y="28" width="208" height="98" rx="2" fill="#000" opacity=".45" filter="url(#softer)"/>
  <rect x="16" y="26" width="208" height="98" rx="2" fill="#3a9a3c" stroke="#2e7f30" stroke-width=".6"/>
  <circle cx="120" cy="26" r="11" fill="#800080"/>
  <circle cx="120" cy="24" r="7.5" fill="#ff00ff" stroke="#400040" stroke-width=".8"/>
  <circle cx="120" cy="24" r="3" fill="#400040"/>

  <g fill="none" stroke="#6cc463" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round" opacity=".6">
    <path d="M40 84 H36 L30 90 V100"/>
    <path d="M40 78 H33 L27 84 V100"/>
    <path d="M40 72 H30 L24 78 V100"/>
    <path d="M92 52 H102 L106 56 V59.6"/>
    <path d="M92 49 H108 L114 55 V59.6"/>
    <path d="M92 46 H116 L122 52 V59.6"/>
    <path d="M92 43 H124 L130 49 V59.6"/>
    <path d="M92 86 H98 L100 88 V100"/>
    <path d="M166 47 V51 L176 59.6"/>
    <path d="M172 47 V51 L182 59.6"/>
    <path d="M178 47 V51 L188 59.6"/>
    <path d="M184 47 V51 L194 59.6"/>
    <path d="M104 88.4 V100 M110 88.4 V100 M116 88.4 V100 M122 88.4 V100 M128 88.4 V100 M134 88.4 V100"/>
    <path d="M176 88.4 V100 M182 88.4 V100 M188 88.4 V100 M194 88.4 V100 M200 88.4 V100 M206 88.4 V100"/>
    <path d="M212 64 H215 M212 70 H215 M212 76 H215 M212 82 H215"/>
    <path d="M140 36 H154"/>
    <path d="M204 48 V54 H198"/>
  </g>
  <g fill="#74c466">
    <circle cx="30" cy="40" r="1.5"/><circle cx="26" cy="66" r="1.5"/><circle cx="100" cy="43" r="1.5"/>
    <circle cx="140" cy="36" r="1.5"/><circle cx="154" cy="36" r="1.5"/><circle cx="150" cy="56" r="1.5"/>
    <circle cx="198" cy="54" r="1.5"/><circle cx="210" cy="96" r="1.5"/><circle cx="84" cy="94" r="1.5"/>
  </g>
  <g fill="#1d4a1d">
    <circle cx="30" cy="40" r=".6"/><circle cx="26" cy="66" r=".6"/><circle cx="100" cy="43" r=".6"/>
    <circle cx="140" cy="36" r=".6"/><circle cx="154" cy="36" r=".6"/><circle cx="150" cy="56" r=".6"/>
    <circle cx="198" cy="54" r=".6"/><circle cx="210" cy="96" r=".6"/><circle cx="84" cy="94" r=".6"/>
