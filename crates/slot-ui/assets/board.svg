  <rect x="26.9" y="47" width="3.2" height="6" fill="#b8905e"/><rect x="26.9" y="47" width="3.2" height="1.4" fill="#cfd0d4"/><rect x="26.9" y="51.6" width="3.2" height="1.4" fill="#cfd0d4"/>
  <rect x="148" y="45.5" width="6" height="3.2" fill="#b8905e"/><rect x="148" y="45.5" width="1.4" height="3.2" fill="#cfd0d4"/><rect x="152.6" y="45.5" width="1.4" height="3.2" fill="#cfd0d4"/>
  <rect x="94" y="78" width="3.2" height="6" fill="#b8905e"/><rect x="94" y="78" width="3.2" height="1.4" fill="#cfd0d4"/><rect x="94" y="82.6" width="3.2" height="1.4" fill="#cfd0d4"/>
