<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="240" height="135">
  <!-- The back half of a cart with the front slid off, and the board in it, after a photograph
       of an opened cartridge. Shell parts are placeholder colours that board.rs swaps for the
       cart's own plastic: #ff00ff the wall, #800080 the floor, #400040 the deepest shadow.
       No text: usvg has no fonts loaded here, so board.rs sets the ROM marking itself. -->
  <defs>
    <pattern id="fingers" width="6.125" height="24" patternUnits="userSpaceOnUse">
      <rect x="1" width="4.1" height="24" rx=".8" fill="#d4a93c"/>
    </pattern>
    <pattern id="pinsH" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect x=".7" width="1.6" height="3" fill="#b3b3b8"/>
    </pattern>
    <pattern id="pinsV" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect y=".7" width="3" height="1.6" fill="#b3b3b8"/>
    </pattern>
    <filter id="softer" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="cavity">
