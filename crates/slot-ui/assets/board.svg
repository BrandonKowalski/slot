  <rect x="22" y="100" width="196" height="24" fill="url(#fingers)"/>

  <!-- The ROM, legs down both long sides; its marking is set by board.rs. -->
  <rect x="40" y="33" width="3" height="54" fill="url(#pinsV)"/>
  <rect x="89" y="33" width="3" height="54" fill="url(#pinsV)"/>
  <rect x="43" y="31" width="46" height="58" rx="1" fill="#1a1a1a"/>
  <circle cx="47.5" cy="84.5" r="1.3" fill="#333333"/>

  <!-- The save chip: legs, no marking. -->
  <rect x="162" y="27" width="24" height="3" fill="url(#pinsH)"/>
  <rect x="162" y="44" width="24" height="3" fill="url(#pinsH)"/>
  <rect x="160" y="30" width="28" height="14" rx="1" fill="#1a1a1a"/>
  <circle cx="163.5" cy="40.5" r="1" fill="#333333"/>

  <!-- The clock cell; its print is set by board.rs. -->
  <circle cx="204" cy="38" r="10" fill="#bfc0c6" stroke="#8c8d93" stroke-width=".9"/>
  <circle cx="204" cy="38" r="7.6" fill="none" stroke="#a5a6ac" stroke-width=".7"/>

  <!-- Clips moulded into the side walls, over the board's edges. -->
  <rect x="9" y="56" width="10" height="10" rx="1" fill="#ff00ff" stroke="#400040" stroke-width=".6"/>
  <rect x="221" y="56" width="10" height="10" rx="1" fill="#ff00ff" stroke="#400040" stroke-width=".6"/>

  <!-- Fiducials, a test pad, and a column of pads with nothing fitted. -->
  <rect x="21" y="30" width="6" height="6" fill="#1a3d1a" stroke="#eef5e6" stroke-width=".5"/>
  <rect x="214" y="88" width="6" height="6" fill="#1a3d1a" stroke="#eef5e6" stroke-width=".5"/>
  <circle cx="218" cy="53" r="2" fill="#d4a93c"/>
  <g fill="#d4a93c">
    <rect x="215" y="63.3" width="4" height="1.4"/><rect x="215" y="69.3" width="4" height="1.4"/>
    <rect x="215" y="75.3" width="4" height="1.4"/><rect x="215" y="81.3" width="4" height="1.4"/>
  </g>

  <!-- Passives in dashed silkscreen boxes: capacitors, and a row of three-legged parts. -->
  <g fill="none" stroke="#eef5e6" stroke-width=".45" stroke-dasharray="1.2 .8">
    <rect x="94" y="29" width="12" height="9"/>
    <rect x="24" y="44" width="9" height="12"/>
    <rect x="142" y="88" width="8" height="8"/>
    <rect x="152" y="88" width="8" height="8"/>
    <rect x="162" y="88" width="8" height="8"/>
