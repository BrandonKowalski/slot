[package]
name = "slot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device"]

[dependencies]
# default-features = false or `host` unifies on for every build: the feature comes in through
# this line whatever the features above ask for, and the device build compiles glutin and
# winit it can never use. The `host` and `device` features above are what turn the backend
# on, and they are mutually exclusive.
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }
pbkdf2 = "0.12"
sha1 = "0.10"
httparse = "1"
serde_json = "1"

[dev-dependencies]
# `TexId::from_raw`, so a draw test can name the faces the binary uploads at boot without a
# live GL context to upload them with. A dev-dependency only: the feature must not reach the
# device build, where a forged handle would alias whatever real texture sits at that index.
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
